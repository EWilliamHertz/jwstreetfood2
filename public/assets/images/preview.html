<!DOCTYPE html>
<html lang="en">
<head>
<title>Image Preview</title>
<style>
  body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
  img { max-width: 100%; height: auto; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Preview Uploaded Images</h1>
  <div class="grid">

    <div class="card"><h3>IMG_5800.jpeg</h3><img src="IMG_5800.jpeg" alt="5800"></div>
    <div class="card"><h3>IMG_5801.jpeg</h3><img src="IMG_5801.jpeg" alt="5801"></div>
    <div class="card"><h3>IMG_5802.jpeg</h3><img src="IMG_5802.jpeg" alt="5802"></div>
    <div class="card"><h3>IMG_5803.jpeg</h3><img src="IMG_5803.jpeg" alt="5803"></div>
    <div class="card"><h3>IMG_5805.jpeg</h3><img src="IMG_5805.jpeg" alt="5805"></div>
  </div>
</body>
</html>
